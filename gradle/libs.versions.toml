[versions]
kotlin = "2.1.21"
agp = "8.7.3"
compileSdk = "35"
minSdk = "26"
targetSdk = "35"
composeMultiplatform = "1.7.3"
composeMaterial3 = "1.7.3"
androidxActivity = "1.10.1"
androidxCore = "1.15.0"
androidxLifecycle = "2.8.4"
androidxSplashscreen = "1.0.1"
junit = "4.13.2"
sqldelight = "2.0.2"
ktor = "3.0.3"
